# The OSC gateway (and optional Companion control) is the shared relay in ../brain-control.
include:
  - path: ../brain-control/docker-compose.yml

services:
  audiobrain-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      additional_contexts:
        brain-control: ../brain-control
    image: audiobrain-web
    container_name: audiobrain-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUDIOBRAIN_WEB_PORT:-5178}:80"

  # Development: docker compose --profile dev up audiobrain-dev
  audiobrain-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      additional_contexts:
        brain-control: ../brain-control
    image: audiobrain-dev
    container_name: audiobrain-dev
    ports:
      - "127.0.0.1:5178:5178"
    volumes:
      - .:/app
      - /app/node_modules
      - ../brain-control:/brain-control
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Storybook: docker compose --profile storybook up audiobrain-storybook
  audiobrain-storybook:
    profiles: ["storybook"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      additional_contexts:
        brain-control: ../brain-control
    image: audiobrain-dev
    container_name: audiobrain-storybook
    command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - .:/app
      - /app/node_modules
      - ../brain-control:/brain-control
