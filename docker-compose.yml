services:
  audiobrain-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: audiobrain-web
    container_name: audiobrain-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUDIOBRAIN_WEB_PORT:-5178}:80"

  audiobrain-osc:
    build:
      context: .
      dockerfile: Dockerfile.osc
    image: audiobrain-osc
    container_name: audiobrain-osc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:9001:9001/udp"
    environment:
      - OSC_TARGET_HOST=${OSC_TARGET_HOST:-host.docker.internal}
      - OSC_TARGET_PORT=${OSC_TARGET_PORT:-9000}
      - OSC_ALLOWED_ORIGINS=${OSC_ALLOWED_ORIGINS:-http://127.0.0.1:5178,http://localhost:5178}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Development: docker compose --profile dev up audiobrain-dev
  audiobrain-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: audiobrain-dev
    container_name: audiobrain-dev
    ports:
      - "127.0.0.1:5178:5178"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Storybook: docker compose --profile storybook up audiobrain-storybook
  audiobrain-storybook:
    profiles: ["storybook"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: audiobrain-dev
    container_name: audiobrain-storybook
    command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - .:/app
      - /app/node_modules
