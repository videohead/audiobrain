worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  map $uri $frame_options {
    default DENY;
    ~^/storybook/ SAMEORIGIN;
  }

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options $frame_options always;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /build.json {
      expires -1;
      try_files $uri =404;
    }

    # Keep the prefix-aware build testable directly on the loopback port.
    # Traefik strips /audiobrain in production, while direct checks do not.
    location = /audiobrain {
      return 308 /audiobrain/;
    }

    location ^~ /audiobrain/ {
      rewrite ^/audiobrain/(.*)$ /$1 last;
    }

    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
